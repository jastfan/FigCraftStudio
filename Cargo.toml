[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
]

[workspace.package]
version = "0.11.2"
edition = "2021"
authors = ["FigCraft Contributors <support@figcraft.local>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/figcraft"

[workspace.dependencies]
figcraft-geom = { path = "crates/geom" }
figcraft-color = { path = "crates/color" }
figcraft-layout = { path = "crates/layout" }
figcraft-doc = { path = "crates/doc" }
figcraft-engine = { path = "crates/engine" }
figcraft-render = { path = "crates/render" }
figcraft-format = { path = "crates/format" }
figcraft-ui-egui = { path = "crates/ui-egui" }
figcraft-mcp = { path = "crates/mcp" }
figcraft-collab-net = { path = "crates/collab-net" }

eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"
tiny-skia = "0.11"
kurbo = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
chrono = "0.4"
tokio = { version = "1.0", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
